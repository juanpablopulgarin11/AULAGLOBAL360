<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none">
  <defs>
    <linearGradient id="iconGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="50%" stop-color="#0D9488" />
      <stop offset="100%" stop-color="#2563EB" />
    </linearGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
  </defs>

  <!-- Fondo de escudo redondeado sutil -->
  <rect width="64" height="64" rx="14" fill="url(#bgGrad)" stroke="#1E293B" stroke-width="1.5" />

  <!-- Órbita 360° -->
  <circle cx="32" cy="32" r="23" stroke="#334155" stroke-width="1.2" stroke-dasharray="2 3" />
  <path d="M 32 9 A 23 23 0 1 1 12 43" fill="none" stroke="url(#iconGradient)" stroke-width="2.5" stroke-linecap="round" />
  <polygon points="12,43 9,36 17,38" fill="#38BDF8" />

  <!-- Nodos cinemáticos biomecánicos -->
  <!-- Cabeza -->
  <circle cx="32" cy="20" r="3.6" fill="#F8FAFC" stroke="#0D9488" stroke-width="1.2" />
  
  <!-- Cuerpo e impulsión motriz -->
  <path d="M 32 24 L 30 35 L 40 45" stroke="#F8FAFC" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" />
  <path d="M 30 35 L 22 46 L 16 43" stroke="#94A3B8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
  
  <!-- Braceo sagital (oposición) -->
  <path d="M 31 28 L 39 30 L 44 25" stroke="url(#iconGradient)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
  <path d="M 31 28 L 24 27 L 22 34" stroke="#94A3B8" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Keypoints articulares -->
  <circle cx="31" cy="28" r="1.8" fill="#38BDF8" />
  <circle cx="30" cy="35" r="1.8" fill="#0D9488" />
  <circle cx="40" cy="45" r="1.8" fill="#38BDF8" />
  <circle cx="22" cy="46" r="1.6" fill="#94A3B8" />
  <circle cx="39" cy="30" r="1.6" fill="#2563EB" />
</svg>
