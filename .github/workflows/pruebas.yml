name: Pruebas backend

on:
  push:
    paths: ["backend/**", "docs/datos/**", "script.js", "package.json", ".github/workflows/pruebas.yml"]
  pull_request:
    paths: ["backend/**", "docs/datos/**", "script.js", "package.json"]

jobs:
  pytest:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements/*.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Bibliotecas de sistema para OpenCV/MediaPipe
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libgl1 libegl1 libgles2
      - name: Dependencias
        run: pip install -r requirements/dev.txt
      - name: Regenerar dorados desde el script.js actual
        # Las pruebas de paridad comparan Python contra lo que produce hoy script.js.
        # (No se compara el archivo byte a byte: distintas versiones de V8 varían el último decimal.)
        run: |
          node tests/golden/generar_dorados.js
          git diff --quiet tests/golden/dorados.json || echo "::notice::dorados.json difiere del commiteado (decimales o cambio en script.js)"
      - name: Migraciones al día
        run: python manage.py makemigrations --check --dry-run
      - name: Pruebas
        run: python -m pytest -q
      - name: Chequeo de producción
        env:
          DJANGO_SECRET_KEY: ${{ github.run_id }}-clave-de-ci-suficientemente-larga-y-aleatoria-para-el-chequeo
          DJANGO_ALLOWED_HOSTS: localhost
        run: python manage.py check --deploy --settings=config.settings.prod --fail-level ERROR

  pytest-mysql:
    # Producción usa MySQL (Cloud SQL): la misma suite contra MySQL 8.4
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
          MYSQL_DATABASE: aula
        ports: ["3306:3306"]
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1" --health-interval=5s --health-timeout=5s --health-retries=20
    env:
      DATABASE_URL: mysql://root@127.0.0.1:3306/aula
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements/*.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Bibliotecas de sistema para OpenCV/MediaPipe
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libgl1 libegl1 libgles2
      - name: Dependencias
        run: pip install -r requirements/dev.txt PyMySQL==1.2.3
      - name: Dorados desde el script.js actual
        run: node tests/golden/generar_dorados.js
      - name: Pruebas contra MySQL
        run: python -m pytest -q --ds=config.settings.test_mysql
